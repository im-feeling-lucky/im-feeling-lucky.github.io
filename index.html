<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I'm Feeling Lucky</title>
  <link rel="stylesheet" href="styles.css">
  <script src="redirect.js"></script>
</head>
<body>
  <main id="recovery-ui" class="container" hidden>
    <h1 class="title">I'm Feeling Lucky</h1>
    <form id="search-form" class="search-form" novalidate>
      <input
        id="query-input"
        class="query-input"
        type="text"
        name="q"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search query"
        placeholder="Search or edit query..."
      >
      <div class="actions">
        <button type="submit" class="btn btn-primary" data-mode="lucky">I'm Feeling Lucky</button>
        <button type="button" id="google-search-btn" class="btn btn-secondary" data-mode="search">Google Search</button>
      </div>
      <p class="hints">
        <kbd>Enter</kbd> for Lucky &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> for Google Search
      </p>
    </form>
  </main>
</body>
</html>
